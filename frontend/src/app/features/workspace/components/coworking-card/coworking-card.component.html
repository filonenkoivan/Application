<div>
  <div class="space-y-[24px] mb-[15px] mt-[44px]">
    <div class="bg-white rounded-2xl">
      <div
        class="flex p-[16px] items-start container flex-wrap gap-y-[10px] space-between"
      >
        <div class="flex w-[100%] flex-wrap row-container items-start">
          <div class="min-w-0 max-w-[340px] mr-[32px]">
            <div class="mb-[12px]">
              <img [src]="coworking.photoUrl" alt="" />
            </div>
          </div>
          <div class="grow">
            <div>
              <span
                class="text-[32px] leading-[1.2] mb-[12px] block font-bold"
                >{{ coworking.name }}</span
              >
              <p
                class="mb-[32px] max-w-[648px] text-base leading-6 text-[#6B6B6B] mr-[15px] desc"
              >
                {{ coworking.description }}
              </p>
            </div>
            <div class="flex items-center mb-[12px]">
              <div class="rounded-[12px] bg-[#F5F3FB] p-[10px] mr-[16px]">
                <img
                  class="w-[24px] h-[24px]"
                  src="images/icons/address.svg"
                  alt=""
                />
              </div>
              <span>{{ coworking.address }}</span>
            </div>
            <div class="flex items-center">
              <div class="rounded-[12px] bg-[#F5F3FB] p-[10px] mr-[16px]">
                <img
                  class="w-[24px] h-[24px]"
                  src="images/icons/armchair.svg"
                  alt=""
                />
              </div>
              <div
                class="flex gap-x-[5px] flex-wrap benefits gap-y-[5px] mb-[15px]"
              >
                <div>
                  🪑 <span *ngIf="coworking.desks == 0">No</span>
                  <span *ngIf="coworking.desks != 0">{{
                    coworking.desks
                  }}</span>
                  desk<span *ngIf="coworking.desks > 1 || coworking.desks == 0"
                    >s</span
                  >
                </div>
                <div>
                  🔒 <span *ngIf="coworking.privateRooms == 0">No</span>
                  <span *ngIf="coworking.privateRooms != 0">{{
                    coworking.privateRooms
                  }}</span>
                  private room<span
                    *ngIf="
                      coworking.privateRooms > 1 || coworking.privateRooms == 0
                    "
                    >s</span
                  >
                </div>
                <div>
                  👥 <span *ngIf="coworking.meetingsRooms == 0">No</span>
                  <span *ngIf="coworking.meetingsRooms != 0">{{
                    coworking.meetingsRooms
                  }}</span>
                  private room<span
                    *ngIf="
                      coworking.meetingsRooms > 1 ||
                      coworking.meetingsRooms == 0
                    "
                    >s</span
                  >
                </div>
              </div>
            </div>
          </div>
          <button
            (click)="goToWorkspace()"
            class="bg-[#5C5AF3] cursor-pointer text-[#ffffff] text-base py-[14.5px] px-[52px] rounded-lg"
          >
            View details
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
